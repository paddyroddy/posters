---
name: Quarto Publish

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/github-pages/quarto@67a4ca698e2e983c8a2edd3a970c7a297598b7dd # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
